# Every push and pull request: the daemon's test suite (node:test). The
# release workflow runs this first, too. The two app-parity cases skip here
# (no app checkout beside this one); the release build runs that gate itself.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
